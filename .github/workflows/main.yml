name: Daily Scraper
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
      - name: Run Scraper
        run: python scraper.py
      - name: Upload Tenders CSV
        uses: actions/upload-artifact@v4
        with:
          name: tender-results
          path: tenders.csv
